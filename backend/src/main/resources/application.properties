spring.application.name=ecommerce-backend
server.port=8080

# Database Configuration (Defaults to in-memory H2, auto-overridden by env vars in Docker/Postgres)
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson snake_case serialization and deserialization
spring.jackson.property-naming-strategy=SNAKE_CASE
