spring.application.name=ecommerce-backend
server.port=8080

# Database Configuration (MySQL for local development)
# Credentials are read from environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
# so secrets are never hardcoded or committed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookworm_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Jackson snake_case serialization and deserialization
spring.jackson.property-naming-strategy=SNAKE_CASE
